<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Benim Robotum</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; overflow: hidden;
  background: radial-gradient(ellipse at center, #172d49, #050812 75%);
  color: white; font-family: system-ui, sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}
#robot {
  width: min(90vw, 390px); aspect-ratio: 0.88;
  border: 2px solid #294b6a; border-radius: 44% 44% 35% 35%;
  background: linear-gradient(145deg,#17283b,#080f1d);
  box-shadow: 0 0 55px #00bfff22, inset 0 0 35px #00aaff18;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 34px;
  position: relative;
}
#antenna {
  position: absolute; top: -29px; width: 5px; height: 29px;
  background: #42dfff; border-radius: 5px;
}
#antenna:before {
  content: ""; position: absolute; width: 15px; height: 15px;
  background: #5be7ff; border-radius: 50%; top: -9px; left: -5px;
  box-shadow: 0 0 18px #00cfff;
}
.eyes { display: flex; gap: clamp(18px,7vw,32px); }
.eye {
  width: clamp(95px, 29vw, 125px);
  height: clamp(115px, 34vw, 150px);
  border-radius: 48%;
  background: radial-gradient(ellipse at 35% 25%, #e2ffff, #73edff 25%, #17a9e8 65%, #09649e);
  box-shadow: 0 0 25px #16caff88, inset 0 -10px 22px #004c9b66;
  position: relative; overflow: hidden;
  animation: breathe 3s ease-in-out infinite;
}
.eye:after {
  content: ""; position: absolute; top: 15%; left: 20%;
  width: 24%; height: 16%; border-radius: 50%;
  background: #fff; opacity: .85; filter: blur(2px);
}
.pupil {
  position: absolute; width: 43%; height: 50%;
  top: 28%; left: 50%;
  transform: translate(calc(-50% + var(--px,0px)),
                       calc(-50% + var(--py,0px)));
  border-radius: 50%; background: #03162c;
  transition: transform .12s ease;
}
.pupil:after {
  content: ""; position: absolute; top: 18%; left: 20%;
  width: 27%; height: 24%; border-radius: 50%; background: white;
}
.eye.blink { animation: blink .22s ease-in-out; }
@keyframes blink {
  0%,100% { transform: scaleY(1); }
  50% { transform: scaleY(.08); }
}
@keyframes breathe {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.12); }
}
.mouth {
  width: 76px; height: 12px; border-radius: 20px;
  background: #1acbff; box-shadow: 0 0 15px #00bfff88;
  transition: all .2s;
}
.talking .mouth { height: 30px; border-radius: 40%; }
h2 { margin: 27px 0 5px; font-size: 25px; }
#status { color: #a7c8df; text-align: center; min-height: 24px; }
button {
  border: 1px solid #3ccfff; border-radius: 30px;
  padding: 15px 28px; background: #123451; color: white;
  font-size: 17px; margin-top: 18px;
}
button:active { background: #087ca7; }
.small { color: #66849c; font-size: 12px; margin-top: 15px; }
</style>
</head>
<body>
<div id="robot">
  <div id="antenna"></div>
  <div class="eyes">
    <div class="eye"><div class="pupil"></div></div>
    <div class="eye"><div class="pupil"></div></div>
  </div>
  <div class="mouth"></div>
</div>

<h2>Merhaba! 👋</h2>
<div id="status">Ben senin robot arkadaşınım.</div>
<button id="talk">🎙️ Benimle konuş</button>
<div class="small">ROBOT v1.0 · Her zaman öğrenmeye hazır</div>

<script>
const robot = document.querySelector("#robot");
const statusText = document.querySelector("#status");
const button = document.querySelector("#talk");
const eyes = [...document.querySelectorAll(".eye")];

function blink() {
  const eye = eyes[Math.floor(Math.random() * eyes.length)];
  eye.classList.add("blink");
  setTimeout(() => eye.classList.remove("blink"), 240);
  setTimeout(blink, 1800 + Math.random() * 3500);
}
setTimeout(blink, 1200);

function look(x, y) {
  document.querySelectorAll(".pupil").forEach(p => {
    p.style.setProperty("--px", (x * 10) + "px");
    p.style.setProperty("--py", (y * 10) + "px");
  });
}
document.addEventListener("pointermove", e => {
  look(e.clientX / innerWidth * 2 - 1,
       e.clientY / innerHeight * 2 - 1);
});

function speak(text) {
  statusText.textContent = text;
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "tr-TR";
  msg.rate = 1;
  msg.onstart = () => robot.classList.add("talking");
  msg.onend = () => robot.classList.remove("talking");
  speechSynthesis.speak(msg);
}

function answer(text) {
  const t = text.toLocaleLowerCase("tr-TR");
  if (t.includes("merhaba") || t.includes("selam"))
    return "Merhaba! Seni gördüğüme sevindim.";
  if (t.includes("nasılsın"))
    return "Çok iyiyim! Seninle konuşmaya hazırım.";
  if (t.includes("adın ne"))
    return "Ben senin robot arkadaşınım. Bana bir isim verebilirsin.";
  if (t.includes("saat kaç"))
    return "Şu an saat " +
      new Date().toLocaleTimeString("tr-TR",
      {hour:"2-digit",minute:"2-digit"});
  if (t.includes("kimsin"))
    return "Ben senin telefonunda yaşayan robot arkadaşınım.";
  return "Seni duydum! Bir sonraki aşamada bana yapay zekâ ekleyebiliriz.";
}

button.addEventListener("click", () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    speak("Ses tanıma bu önizlemede desteklenmiyor. Robotun gözleri çalışıyor!");
    return;
  }
  const recognition = new SR();
  recognition.lang = "tr-TR";
  recognition.interimResults = false;
  button.textContent = "👂 Seni dinliyorum...";
  statusText.textContent = "Seni dinliyorum...";
  recognition.onresult = e => {
    const words = e.results[0][0].transcript;
    statusText.textContent = "Sen: " + words;
    speak(answer(words));
  };
  recognition.onerror = () => {
    statusText.textContent = "Mikrofon iznini ve internet bağlantını kontrol et.";
  };
  recognition.onend = () => {
    button.textContent = "🎙️ Benimle konuş";
  };
  try { recognition.start(); }
  catch(e) { statusText.textContent = "Tekrar denemek için düğmeye dokun."; }
});
</script>
</body>
</html>
